# Apache Texera (Incubating) committers roster.
#
# Rendered by layouts/committers/list.html at /committers/.
#
# The authoritative roster lives at (requires ASF login):
#   https://whimsy.apache.org/roster/ppmc/texera
#
# Fields per entry:
#   name        - Public full name.
#   lastname    - Family name, used to sort each group alphabetically.
#   id          - Apache ID / LDAP username. Links to the committer's ASF profile.
#   github      - GitHub username (optional). Links to the GitHub profile.
#   affiliation - Organization the person is affiliated with.
#   group       - "ppmc" or "committer".
#
# Groups are listed without duplication, mirroring the project roster:
#   ppmc      -> PPMC members
#   committer -> committers who are not on the PPMC

