# Videos shown on /videos/ (Community ▸ Videos).
#
# Each entry embeds one clip from the Texera Project General YouTube channel:
#   https://www.youtube.com/@texeraprojectgeneral
#
# Apache's site-wide Content-Security-Policy blocks third-party <iframe>
# embeds, so each card links out to YouTube and shows a locally hosted
# thumbnail (Apache also blocks remote images). To add a video:
#   1. Copy its 11-character ID from the watch URL
#      (https://www.youtube.com/watch?v=VIDEO_ID).
#   2. Save its thumbnail under static/images/videos/ with a descriptive,
#      kebab-case name, e.g.
#        curl -o static/images/videos/my-video-name.jpg \
#          https://img.youtube.com/vi/VIDEO_ID/maxresdefault.jpg
#      (fall back to .../mqdefault.jpg if maxresdefault 404s).
#   3. Add a list item below with `id`, `title`, `thumb` (the /images/videos/…
#      path), and an optional `description`.
# Order top-to-bottom is the order shown on the page.
#
# NOTE: The IDs below are Texera demo clips seeded as a starting point. Please
# confirm each one belongs to @texeraprojectgeneral (and is the clip you want)
# before publishing, and add any others from the channel.

