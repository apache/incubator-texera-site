<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Automatic removal of idle Kubernetes computing units in Apache Texera</title>
  <desc id="desc">Texera removes a Kubernetes computing unit when no workflow is running and the unit has been idle longer than the chosen time limit. Cleanup is off by default.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#526176"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#132033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="90" y="105" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Automatic cleanup for idle Kubernetes computing units</text>
  <text x="90" y="156" fill="#5e6b7e" font-family="Arial, Helvetica, sans-serif" font-size="25">Texera checks workflow status and activity—not CPU or memory use.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="245" width="400" height="325" rx="24" fill="#ffffff" stroke="#9aa9bd" stroke-width="3"/>
    <rect x="125" y="285" width="104" height="104" rx="18" fill="#eef3ff" stroke="#2f67d8" stroke-width="3"/>
    <path d="M151 318h52v42h-52z M160 305h34v13h-34z" fill="none" stroke="#2f67d8" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="166" cy="340" r="4" fill="#2f67d8"/>
    <circle cx="188" cy="340" r="4" fill="#2f67d8"/>
    <text x="125" y="438" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Kubernetes CU</text>
    <text x="125" y="483" fill="#5e6b7e" font-family="Arial, Helvetica, sans-serif" font-size="24">A pod that runs workflows</text>
    <text x="125" y="520" fill="#5e6b7e" font-family="Arial, Helvetica, sans-serif" font-size="24">and uses cluster resources</text>
  </g>

  <line x1="505" y1="408" x2="650" y2="408" stroke="#526176" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="675" y="220" width="365" height="375" rx="24" fill="#fffaf0" stroke="#e39a18" stroke-width="3"/>
    <circle cx="730" cy="287" r="28" fill="#e39a18"/>
    <path d="M717 287l9 9 19-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="775" y="298" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">No workflow running</text>
    <line x1="715" y1="335" x2="1000" y2="335" stroke="#ead9b7" stroke-width="2"/>
    <circle cx="730" cy="400" r="28" fill="#e39a18"/>
    <path d="M717 400l9 9 19-22" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="775" y="395" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700">Idle long enough</text>
    <text x="775" y="430" fill="#6f644f" font-family="Arial, Helvetica, sans-serif" font-size="21">Latest activity is older</text>
    <text x="775" y="458" fill="#6f644f" font-family="Arial, Helvetica, sans-serif" font-size="21">than the chosen time limit</text>
    <rect x="715" y="505" width="285" height="52" rx="26" fill="#f6e8c8"/>
    <text x="857" y="539" text-anchor="middle" fill="#8a5800" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Both must be true</text>
  </g>

  <line x1="1055" y1="408" x2="1185" y2="408" stroke="#526176" stroke-width="6" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1210" y="245" width="300" height="325" rx="24" fill="#edf9f2" stroke="#1b9b52" stroke-width="3"/>
    <circle cx="1265" cy="320" r="32" fill="#1b9b52"/>
    <path d="M1250 320l11 11 23-27" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1260" y="405" fill="#146938" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Removed</text>
    <text x="1260" y="451" fill="#416352" font-family="Arial, Helvetica, sans-serif" font-size="23">Pod deleted</text>
    <text x="1260" y="487" fill="#416352" font-family="Arial, Helvetica, sans-serif" font-size="23">Reason saved</text>
    <text x="1260" y="523" fill="#416352" font-family="Arial, Helvetica, sans-serif" font-size="23">Resources freed</text>
  </g>

  <rect x="90" y="670" width="1420" height="140" rx="24" fill="#172033"/>
  <text x="130" y="720" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">SETTINGS</text>
  <text x="130" y="774" fill="#ffcb66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Cleanup</text>
  <text x="245" y="774" fill="#d9e0ea" font-family="Arial, Helvetica, sans-serif" font-size="23">off by default</text>
  <line x1="510" y1="730" x2="510" y2="785" stroke="#46536a" stroke-width="2"/>
  <text x="555" y="774" fill="#ffcb66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Idle limit</text>
  <text x="705" y="774" fill="#d9e0ea" font-family="Arial, Helvetica, sans-serif" font-size="23">24 hours by default</text>
  <line x1="1010" y1="730" x2="1010" y2="785" stroke="#46536a" stroke-width="2"/>
  <text x="1055" y="774" fill="#ffcb66" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Check every</text>
  <text x="1225" y="774" fill="#d9e0ea" font-family="Arial, Helvetica, sans-serif" font-size="23">1 hour by default</text>
</svg>
